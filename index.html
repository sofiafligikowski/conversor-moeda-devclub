<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>conversor-moeda-devclub</title>
</head>

<body>

    <img src="./assets/logo 1.png" alt="logo-do-site" class="logo">

    <main>
        <label>
            Converter <b>de</b>
            <select>
                <option>R$ Real Brasileiro</option>
            </select>
        </label>

        <label>
            Converter <b>para</b>
            <select class="currency-select">
                <option value="dolar">US$ Dólar americano</option>
                <option value="euro">€ Euro</option>
                <option value="yuan">¥ Yuan</option>
                <option value="iene">¥ Iene japonês</option>
                <option value="libra">£ Libras esterlina</option>
            </select>
        </label>

        <label>
            Valor
            <input class="input-value" placeholder=" R$ 10.000,00">
        </label>

        <button id="convert-button">Converter</button>

        <section>
            <div class="coin-box">
                <img src="./assets/icons8-brasil-100.png" alt="logo-moeda-a-converter">
                <p class="coin">Real</p>
                <p class="coin-value-to-convert">R$ 0,00</p>
            </div>

            <img src="./assets/Vector.png" alt="seta" class="arrow">

            <div class="coin-box">
                <img class="currency-img" src="./assets/icons8-eua-100.png" alt="logo-moeda-convertida">
                <p class="coin" id="currency-name">Dólar americano</p>
                <p class="coin-value">US$ 0,00</p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
